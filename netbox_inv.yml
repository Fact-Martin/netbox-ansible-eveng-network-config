plugin: netbox.netbox.nb_inventory
# Dynamic lookup filters read from terminal environment variables
validate_certs: false

# Convert hyphens to underscore
transform_nested_groups: true

# Pull devices from  MCF--HQ lab site
query_filters:
  - site: 'mcf-hq'

# Explicitly pull routers, cores, and distribution nodes (excluding access)
device_query_filters:
  - role: 'edge-router'
  - role: 'core-switch'
  - role: 'dist-switch'

# Automatically sort nodes into inventory groups based on their NetBox roles
group_by:
  - device_roles

# Forces Ansible to connect to the NetBox Primary IPv4 address
ansible_host_dns_name: false
